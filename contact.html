<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact — rishabh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      line-height: 1.7;
    }

    a {
      color: #0066cc;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    a:hover {
      color: #000;
    }

    .page {
      width: min(700px, calc(100% - 40px));
      margin: 45px auto 80px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      text-transform: uppercase;
    }

    .intro {
      margin: 0 0 56px;
      font-size: 18px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 16px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d8d8d8;
      border-radius: 0;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 18px;
      padding: 15px;
      outline: none;
    }

    input {
      height: 57px;
    }

    textarea {
      min-height: 225px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9aa3b1;
      opacity: 1;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      height: 56px;
      margin-top: 10px;
      border: 0;
      border-radius: 0;
      background: #000;
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #222;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status {
      min-height: 27px;
      margin-top: 14px;
      font-size: 14px;
    }

    .email-section {
      margin-top: 42px;
    }

    .email-section h2 {
      margin: 0 0 22px;
      font-size: 18px;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .email {
      font-size: 18px;
    }

    @media (max-width: 600px) {
      .page {
        width: calc(100% - 32px);
        margin-top: 30px;
      }

      .intro {
        font-size: 16px;
      }

      input,
      textarea {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>CONTACT</h1>

    <p class="intro">
      i read every message. always open to collaborating or helping out.
    </p>

    <form id="contactForm">

      <div class="field">
        <label for="email">email*</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="your@email.com"
          required
        >
      </div>

      <div class="field">
        <label for="message">message*</label>
        <textarea
          id="message"
          name="message"
          placeholder="write a message ..."
          required
        ></textarea>
      </div>

      <button type="submit" id="submitButton">Send</button>

      <div class="status" id="status"></div>

    </form>

    <section class="email-section">
      <h2>OR EMAIL AT:</h2>

      <a class="email" href="mailto:rg6367229@gmail.com">
        rg6367229@gmail.com
      </a>
    </section>

  </main>

  <script>
    const form = document.getElementById("contactForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!email || !message) {
        status.textContent = "please fill in both fields.";
        return;
      }

      const subject = encodeURIComponent("message from my website");
      const body = encodeURIComponent(
        "From: " + email + "\n\n" + message
      );

      button.disabled = true;
      button.textContent = "opening mail...";

      window.location.href =
        "mailto:contact@yourdomain.com?subject=" +
        subject +
        "&body=" +
        body;

      setTimeout(() => {
        button.disabled = false;
        button.textContent = "click";
      }, 1500);
    });
  </script>

</body>
</html>
